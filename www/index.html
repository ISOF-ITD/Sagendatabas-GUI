<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<title>Folke Forska - ISOF</title>

	<link rel="stylesheet" href="css/style-basic.css"/>

	<style>
		/* Enkel, tillgänglig driftbanner */
		.service-banner {
			box-sizing: border-box;
			width: 100%;
			border-bottom: 4px solid #0b3d91;
			background: #f6f7f9;
			color: #111;
		}
		.service-banner__inner {
			box-sizing: border-box;
			max-width: 1100px;
			margin: 0 auto;
			padding: 14px 16px;
			display: flex;
			gap: 12px;
			align-items: flex-start;
		}
		.service-banner__badge {
			flex: 0 0 auto;
			padding: 4px 10px;
			border-radius: 999px;
			background: #1c3f49;
			color: #fff;
			font-weight: 700;
			line-height: 1.2;
			font-size: 0.95rem;
		}
		.service-banner__content {
			flex: 1 1 auto;
			min-width: 0;
		}
		.service-banner__title {
			margin: 0 0 4px 0;
			font-size: 1.05rem;
			line-height: 1.35;
		}
		.service-banner__text {
			margin: 0;
			font-size: 1rem;
			line-height: 1.5;
		}
		.service-banner__text a {
			color: #1c3f49;
			text-decoration: underline;
			text-underline-offset: 2px;
			font-weight: 600;
		}
		.service-banner__text a:focus,
		.service-banner__text a:hover {
			text-decoration-thickness: 2px;
		}
		@media (max-width: 520px) {
			.service-banner__inner {
				flex-direction: column;
				align-items: flex-start;
			}
		}
	</style>
</head>

<body>

	<!-- Drift-/avvecklingsbanner -->
	<section
		class="service-banner"
		role="region"
		aria-label="Viktig information om Folke forska"
		aria-live="polite"
	>
		<div class="service-banner__inner">
			<div class="service-banner__badge" aria-hidden="true">Info</div>
			<div class="service-banner__content">
				<h2 class="service-banner__title" lang="sv">
					Folke forska stängs sommaren 2026
				</h2>
				<p class="service-banner__text" lang="sv">
					Den här tjänsten kommer att tas bort sommaren 2026.
					Du kan fortsätta att ta del av materialet via
					<a href="https://sok.folke.isof.se/" rel="noopener">Folke sök</a>.
					Transkriberade texter finns också sökbara i
					<a href="https://spraakbanken.gu.se/resurser/sbs-folke" rel="noopener">Korp (Språkbanken)</a>.
				</p>
			</div>
		</div>
	</section>

<div id="app"></div>

<script>
	// Avoid caching of the script
	document.write("<script type='text/javascript' src='js/app.js?v=" + Date.now() + "'><\/script>");
</script>
<!-- <script src="js/app.js"></script> -->

<!-- Matomo -->
<script>
	const hostname = window.location.hostname;
	const is_dev = ["127.0.0.1", "localhost", "0.0.0.0"].some((element) =>
	hostname.includes(element)
	);
	const is_test = ["-test."].some((element) => hostname.includes(element));
	const ENV = is_dev ? "dev" : is_test ? "test" : "prod";

	const matomo_site_ids = {
		'dev': 72,
		'test': 71,
		'prod': 69,
	}

	const siteId = matomo_site_ids[ENV];

	console.log("Matomo siteId: " + siteId);

	var _paq = window._paq = window._paq || [];
	/* tracker methods like "setCustomDimension" should be called before "trackPageView" */
	_paq.push(['trackPageView']);
	window.eventBus.addEventListener('searchForm.matomo', function (event, data) {
		_paq.push(['trackSiteSearch', data.search])
	});
	_paq.push(['enableLinkTracking']);
	(function() {
		var u="https://matomo.isof.se/";
		_paq.push(['setTrackerUrl', u+'matomo.php']);
		_paq.push(['setSiteId', siteId]);
		var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
		g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
	})();

	var currentUrl = location.href;
	window.addEventListener('hashchange', function() {
		_paq.push(['setReferrerUrl', currentUrl]);
		currentUrl = '/' + window.location.hash.substr(1);
		_paq.push(['setCustomUrl', currentUrl]);
		// _paq.push(['setDocumentTitle', 'My New Title']);

		// remove all previously assigned custom variables, requires Matomo (formerly Piwik) 3.0.2
		_paq.push(['deleteCustomVariables', 'page']); 
		_paq.push(['trackPageView']);

		// make Matomo aware of newly added content
		var content = document.getElementById('app');
		_paq.push(['MediaAnalytics::scanForMedia', content]);
		_paq.push(['FormAnalytics::scanForForms', content]);
		_paq.push(['trackContentImpressionsWithinNode', content]);
		_paq.push(['enableLinkTracking']);
	});
</script>
<!-- End Matomo Code -->

</body>
</html>
